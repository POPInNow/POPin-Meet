<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}POPin Meet{% endblock %}</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <style>
        :root {
            --popin-primary: #0066cc;
            --popin-secondary: #4a90e2;
            --popin-accent: #00a3e0;
            --popin-success: #28a745;
            --popin-info: #17a2b8;
        }
        
        .btn-primary {
            background-color: var(--popin-primary);
            border-color: var(--popin-primary);
        }
        
        .btn-primary:hover {
            background-color: var(--popin-secondary);
            border-color: var(--popin-secondary);
        }
        
        .text-primary {
            color: var(--popin-primary) !important;
        }
        
        .bg-primary {
            background-color: var(--popin-primary) !important;
        }
        
        .navbar-brand .badge {
            font-size: 0.6rem;
            vertical-align: top;
        }
        
        .beta-badge {
            background-color: var(--popin-info);
            color: white;
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
            border-radius: 1rem;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-calendar-alt me-2"></i>Meet
                <span class="badge bg-info ms-2">BETA</span>
            </a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer class="mt-5 py-4 bg-dark text-center">
        <div class="container">
            <p class="mb-0 text-muted">&copy; 2025 POPin Labs</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
